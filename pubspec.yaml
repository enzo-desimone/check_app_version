name: check_app_version
description: >
  A Flutter package that checks whether the installed app
  version is up-to-date, supporting file and HTTP endpoint
  JSON sources with in-memory caching and optional UI
  utilities.
version: 3.0.2
homepage: https://github.com/enzo-desimone/check_app_version

screenshots:
  - description: "Cross-platform Flutter in-app update checker displaying customizable force update dialog, version comparison, and remote JSON validation."
    path: example/check-app-version.webp

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
